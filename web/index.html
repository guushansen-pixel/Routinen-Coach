<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Routinen-Coach</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg: #12171E; --card: #1B222C; --line: #2A3441; --txt: #E8EDF2; --muted: #93A0AF;
  --acc: #3FB6A8; --good: #4CC38A; --bad: #E5674F; --warn: #E0A93B;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 8px) 14px calc(var(--sab) + 28px); }
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
#back { background: none; border: 0; color: var(--txt); font-size: 30px; line-height: 1; padding: 0 12px 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.big { font-size: 28px; font-weight: 700; } .center { text-align: center; }
button, a.btn { font: inherit; color: var(--txt); background: #26303D; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; text-decoration: none; display: inline-block; text-align: center; }
button.primary { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 700; }
button.block, a.block { display: block; width: 100%; margin-top: 8px; }
button.ghost { background: none; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip.on { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; } .row > .grow { flex: 1; min-width: 0; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; } .item .grow { flex: 1; min-width: 0; }
.item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .no { width: 26px; height: 26px; border-radius: 50%; background: #0E1319; color: var(--muted); font-size: 12px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
input[type=text], input[type=number], textarea { font: inherit; color: var(--txt); background: #0E1319; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
textarea { resize: none; }
label.f { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
label.c { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
ul { margin: 6px 0; padding-left: 20px; } li { margin: 4px 0; }
.step { display: flex; align-items: center; gap: 6px; }
.step button { width: 42px; padding: 8px 0; } .step b { min-width: 64px; text-align: center; }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 8px; }
.days i { aspect-ratio: 1; border-radius: 4px; background: #0E1319; } .days i.on { background: var(--acc); } .days i.today { outline: 1px solid var(--muted); }
/* Uebung: Vollbild */
#run { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--sat) + 6px) 14px calc(var(--sab) + 12px); touch-action: manipulation; }
#run[hidden], #modal[hidden] { display: none; }
#r-top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
#r-close { background: none; border: 0; font-size: 28px; padding: 0 10px 4px 0; }
#r-prog { flex: 1; font-size: 13px; color: var(--muted); }
#r-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
#r-name { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 6px 0; }
#ball { width: 150px; height: 150px; border-radius: 50%; margin: 10px auto 6px; background: radial-gradient(circle, var(--acc), #1E5F58); transform: scale(.5); flex: 0 0 auto; }
#r-step { font-size: 22px; font-weight: 700; text-align: center; min-height: 32px; }
#r-ctl { display: flex; gap: 8px; margin-top: 10px; } #r-ctl button { flex: 1; padding: 13px 4px; } #r-next { flex: 2 !important; }
.bar { height: 6px; background: #0E1319; border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--acc); }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal > div { background: var(--card); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(var(--sab) + 16px); }
#modal h3 { margin: 0 0 6px; }
.btns { display: flex; gap: 8px; margin-top: 12px; } .btns button { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="Zurück">‹</button><h1 id="title">Routinen-Coach</h1></header>
  <main id="view"></main>
</div>
<div id="run" hidden>
  <div id="r-top"><button id="r-close" aria-label="Schließen">‹</button><span id="r-prog"></span></div>
  <div class="bar"><i id="r-bar"></i></div>
  <div id="r-body"></div>
  <div id="r-ctl"><button id="r-prev">Zurück</button><button id="r-pace">Takt starten</button><button id="r-next" class="primary">Weiter</button></div>
</div>
<div id="modal" hidden><div id="modal-in"></div></div>

<script>
'use strict';
// =====================================================================
// Routinen-Coach: feste taegliche Bewegungs-Routinen Uebung fuer Uebung
// durchgehen, mit Atem-Takt, Stufe und Gewicht je Uebung, Video-Link und
// Verlauf. Ein "System" ist ein Datenpaket (SYSTEMS oder selbst angelegt).
// Die App enthaelt keine fremden Videos und keine Texte aus Buechern: Zu
// The Happy Body bringt sie nur das Geruest mit, den Rest traegt man ein.
// Aufbau: Daten -> Systeme -> Regeln (rein) -> Ablauf -> Ansichten
//         -> Selbsttest (rcTests, ?debug=1). Details in README.md.
// =====================================================================
const $ = id => document.getElementById(id);
const NATIVE = window.RcAndroid;

// ---------------------------------------------------------------- Daten
const K = { db: 'routinen.data.v1' };
let saveOk = true;
function load(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
const db = Object.assign({ schema: 1, cur: 'thb', edits: {}, cfg: {}, own: [], log: [], sound: true }, load(K.db, {}));
function save() { try { localStorage.setItem(K.db, JSON.stringify(db)); } catch (e) { saveOk = false; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dstr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return dstr(new Date()); }

// ---------------------------------------------------------------- Systeme
// Ein System: {id, name, by, about, links, steps (Atemfolge je Wiederholung), def (Vorgaben),
// levels (Zahl der Stufen, 0 = keine), kg (Gewicht je Uebung?), parts: [{name, items: [{id, name, how, link, todo}]}]}
function slots(prefix, part, n) { const a = []; for (let i = 1; i <= n; i++) a.push({ id: prefix + part + '-' + i, name: 'Übung ' + i, how: '', link: '', todo: true }); return a; }
// The Happy Body: Namen und Plaetze der 18 Uebungen, dazu was das Programm je Platz vorsieht
// (pct = Gewicht in Prozent des Grundgewichts aus Uebung 1.1; fix6 = immer 6 Wiederholungen ohne Gewicht).
// Belegt durch die offizielle Seite sind 1.1, 2.4 und 3.5 samt Platz sowie die Namen Fly Up und Rising
// Tower. Alles andere stammt aus EINER Drittquelle (Datendatei einer freien Tracker-App, die sich auf das
// Buch beruft) und ist mit dem Buch abzugleichen. Nur Namen, Zahlen und Links, keine Anleitungstexte.
const THB_NAMES = [['Standing Tall', 'Cresting Wave', 'Take Off', 'Tapping Hammer', 'Sitting Tower', 'Take a Bow'],
  ['Opening Wide', 'Shifting Wave', 'Fly Up', 'Rocking Trunk', 'Rising Tower', 'Encore Bow'],
  ['Lying Long', 'Rolling Wave', 'Lift Off', 'Working Hinges', 'Power Tower', 'Final Bow']];
const THB_PCT = [[100, 0, 0, 150, 200, 150], [50, 0, 0, 200, 100, 150], [150, 0, 0, 50, 100, 150]];
const THB_LINK = { 'thb1-1': 'https://www.youtube.com/watch?v=ShkoQu3MA7k', 'thb3-5': 'https://vimeo.com/266011422' };
function thbSlots(part) {
  return THB_NAMES[part - 1].map((name, k) => { const id = 'thb' + part + '-' + (k + 1), fix6 = k === 1 || k === 2;
    return { id, name, how: '', link: THB_LINK[id] || '', pct: THB_PCT[part - 1][k], fix6, noKg: fix6 }; });
}
const SYSTEMS = [
  { id: 'thb', name: 'The Happy Body', by: 'Aniela und Jerzy Gregorek', levels: 5, kg: true,
    about: 'Tägliche Routine aus 18 Übungen in drei Sequenzen zu je sechs, mit leichten Kurzhanteln und Matte. Jede Übung gibt es in fünf Stufen. Jede Wiederholung folgt derselben Atemfolge; nach dem Üben gehört Entspannung dazu.',
    note: 'Die App enthält keine Anleitungstexte und keine Videos der Autoren, nur Namen, Zahlen und Links. Durch die offizielle Seite belegt sind Standing Tall (1.1), Rocking Trunk (2.4) und Power Tower (3.5). Die übrigen Namen und Plätze sowie Runden, Wiederholungen und Gewichtsanteile stammen aus einer einzelnen Drittquelle, die sich auf das Buch beruft: bitte mit deinem Buch abgleichen und bei Bedarf ändern.', unsure: true,
    links: [['Offizielle Seite', 'https://thehappybody.com/'], ['Video: Sequenz 1, Stufe 1 (offizielle Seite)', 'https://thehappybody.com/the-happy-body-exercises-sequence-1-level-1/'], ['Dasselbe Video bei Vimeo', 'https://vimeo.com/355407164'],
      ['Offizieller YouTube-Kanal', 'https://www.youtube.com/user/thehappybody'], ['Probe aus dem DVD-Set (YouTube)', 'https://www.youtube.com/watch?v=DFgg0grwC8s'], ['Sequenz 3, Video einer Anwenderin (YouTube)', 'https://www.youtube.com/watch?v=RHH-spbsgJw'], ['Alle Übungsvideos kaufen (offizielle Seite)', 'https://thehappybody.com/purchase-the-happy-body-exercise-videos/']],
    steps: ['Einatmen', 'Anspannen', 'Heben', 'Dehnen', 'Zurück', 'Ausatmen'], def: { rounds: 3, reps: 3, stepSec: 1.5, rest: 0, relax: 5 },
    parts: [1, 2, 3].map(p => ({ name: 'Sequenz ' + p, items: thbSlots(p) })) },
  { id: 'mob', name: 'Beweglich in 12 Minuten', by: 'eigenes Programm dieser App', levels: 0, kg: false,
    about: 'Zwölf verbreitete Beweglichkeits-Übungen für Wirbelsäule, Hüfte, Schultern und Haltung, ohne Geräte. Gedacht als Einstieg und als Beispiel dafür, wie ein System in der App aussieht.',
    note: 'Allgemeine Übungen, kein Ersatz für Physiotherapie. Geh nur so weit, wie es ohne Schmerz geht.',
    links: [], steps: ['Einatmen', 'Hinein', 'Halten', 'Zurück'], def: { rounds: 1, reps: 5, stepSec: 3, rest: 5, relax: 2 },
    parts: [
      { name: 'Wirbelsäule und Hüfte', items: [
        { id: 'mob-1', name: 'Katze und Kuh', how: 'Im Vierfüßlerstand den Rücken abwechselnd rund nach oben schieben und sanft durchhängen lassen. Der Kopf folgt der Bewegung, die Arme bleiben gestreckt.' },
        { id: 'mob-2', name: 'Tiefe Hocke', how: 'Füße etwas weiter als schulterbreit, so tief wie möglich in die Hocke, Fersen am Boden. Mit den Ellbogen die Knie leicht nach außen drücken, Brust aufrichten. Bei Bedarf an einem Türrahmen festhalten.' },
        { id: 'mob-3', name: 'Hüftbeuger im Ausfallschritt', how: 'Im halben Kniestand das Becken nach vorn schieben und das Gesäß des hinteren Beins anspannen, bis es vorn in der Leiste zieht. Oberkörper aufrecht. Seite wechseln.' },
        { id: 'mob-4', name: 'Hüftdrehung im Sitzen (90/90)', how: 'Am Boden sitzen, beide Knie etwa im rechten Winkel, eines vor dem Körper, eines seitlich. Aufrecht über das vordere Schienbein lehnen, dann beide Knie zur anderen Seite kippen.' },
        { id: 'mob-5', name: 'Brustwirbel-Drehung', how: 'Im Vierfüßlerstand eine Hand an den Hinterkopf. Den Ellbogen erst zum anderen Arm führen, dann weit zur Decke aufdrehen und hinterherschauen. Seite wechseln.' },
        { id: 'mob-6', name: 'Vorbeuge Wirbel für Wirbel', how: 'Aus dem Stand das Kinn zur Brust und langsam Wirbel für Wirbel nach unten abrollen, die Arme hängen locker. Unten kurz hängen, dann genauso langsam wieder aufrollen. Knie dürfen leicht gebeugt sein.' }] },
      { name: 'Schultern und Haltung', items: [
        { id: 'mob-7', name: 'Große Schulterkreise', how: 'Einen gestreckten Arm langsam in einem möglichst großen Kreis nach vorn, oben und hinten führen, ohne dass der Oberkörper mitdreht. Erst die eine Richtung, dann die andere, dann der andere Arm.' },
        { id: 'mob-8', name: 'Wandengel', how: 'Mit Rücken, Gesäß und Hinterkopf an die Wand. Die Arme wie ein U anlegen und langsam nach oben schieben und wieder senken, Handrücken und Ellbogen bleiben möglichst an der Wand.' },
        { id: 'mob-9', name: 'Brustdehnung am Türrahmen', how: 'Den Unterarm senkrecht an den Türrahmen legen, Ellbogen auf Schulterhöhe, und den Körper langsam nach vorn und leicht weg drehen, bis es in der Brust zieht. Seite wechseln.' },
        { id: 'mob-10', name: 'Y, T und W in Bauchlage', how: 'Auf dem Bauch liegen, Stirn am Boden. Die Arme nacheinander in Y-, T- und W-Form wenige Zentimeter anheben und die Schulterblätter dabei nach hinten unten ziehen.' },
        { id: 'mob-11', name: 'Nacken seitlich dehnen', how: 'Aufrecht sitzen, ein Ohr langsam zur Schulter neigen, die andere Schulter bewusst tief lassen. Nicht ziehen, nur das Gewicht des Kopfes wirken lassen. Seite wechseln.' },
        { id: 'mob-12', name: 'Lang machen im Stand', how: 'Füße hüftbreit, Gewicht auf dem ganzen Fuß. Den Scheitel zur Decke schieben, als würde dich jemand an einem Faden hochziehen, Schultern locker nach hinten unten, Bauch leicht fest.' }] }] }];
function allSystems() { return SYSTEMS.concat(db.own); }
function sysById(id) { return allSystems().find(s => s.id === id) || SYSTEMS[0]; }

// ---------------------------------------------------------------- Regeln (rein)
// Nur https-Links zulassen; alles andere gilt als kein Link.
function safeUrl(u) { u = String(u || '').trim(); return /^https:\/\/[^\s"'<>]+\.[^\s"'<>]+$/i.test(u) ? u : ''; }
function videoSearch(name, sysName) { return 'https://www.youtube.com/results?search_query=' + encodeURIComponent((name + ' ' + (sysName || '') + ' Übung').trim()); }
// Uebung mit den eigenen Aenderungen (Name, Hinweis, Link, Stufe, Gewicht) zusammenfuehren.
function mergeItem(base, edit) {
  const e = edit || {}, o = Object.assign({}, base, { level: e.level || 1, kg: e.kg || 0 });
  if (e.name) { o.name = e.name; o.todo = false; } if (e.how !== undefined) o.how = e.how; if (e.link !== undefined) o.link = e.link;
  return o;
}
// Text -> Teile. "# Titel" beginnt einen Teil; je Zeile "Name | Hinweis | Link".
function parseList(text) {
  const parts = []; let cur = null;
  String(text).split(/\r?\n/).forEach(z => {
    const s = z.trim(); if (!s) return;
    if (s[0] === '#') { cur = { name: s.replace(/^#+\s*/, '').slice(0, 40) || 'Teil ' + (parts.length + 1), items: [] }; parts.push(cur); return; }
    const f = s.split('|').map(x => x.trim()); if (!f[0]) return;
    if (!cur) { cur = { name: 'Teil 1', items: [] }; parts.push(cur); }
    if (cur.items.length < 40) cur.items.push({ name: f[0].slice(0, 60), how: (f[1] || '').slice(0, 600), link: safeUrl(f[2]) });
  });
  return parts.filter(p => p.items.length);
}
// Ablauf: die gewaehlten Teile als flache Liste; jeder Teil wird rounds-mal hintereinander durchlaufen.
function sessionPlan(sys, partIdx, rounds) {
  const out = [], n = Math.max(1, rounds || 1);
  sys.parts.forEach((p, pi) => { if (partIdx.indexOf(pi) >= 0) for (let r = 1; r <= n; r++) p.items.forEach(it => out.push({ part: pi, id: it.id, round: r })); });
  return out;
}
// Wiederholungen einer Uebung: fest 6, wo das Programm es so vorsieht, sonst die eingestellte Zahl.
function repsOf(it, cfg) { return it.fix6 ? 6 : cfg.reps; }
// Atem-Takt: Wo steht man nach t Sekunden? {rep (ab 1), step, into (0..1), done}
function paceAt(t, nSteps, stepSec, reps) {
  const per = nSteps * stepSec, total = per * reps; if (t >= total) return { done: true, rep: reps, step: nSteps - 1, into: 1 };
  const r = Math.floor(t / per), u = t - r * per, s = Math.floor(u / stepSec);
  return { done: false, rep: r + 1, step: s, into: (u - s * stepSec) / stepSec };
}
// Kreisgroesse 0..1: waechst in der ersten Haelfte der Schritte, schrumpft in der zweiten.
function ballSize(step, into, nSteps) { const x = (step + into) / nSteps; return x < 0.5 ? x * 2 : (1 - x) * 2; }
function planSeconds(n, sys, cfg) { return n * (sys.steps.length * cfg.stepSec * cfg.reps + cfg.rest) + cfg.relax * 60; }
// Tage in Folge bis heute (ein noch offener heutiger Tag bricht die Serie nicht).
function streak(dates, todayStr) {
  const set = new Set(dates); let d = new Date(todayStr + 'T12:00'), n = 0;
  if (!set.has(dstr(d))) d.setDate(d.getDate() - 1);
  while (set.has(dstr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function fmtKg(v) { return String(Math.round(v * 2) / 2).replace('.', ',') + ' kg'; }
// Eigenes System aus Name und Liste bauen (ids fortlaufend).
function buildSystem(id, name, parts) {
  let n = 0;
  return { id, name: name.slice(0, 40), by: 'eigenes System', own: true, levels: 5, kg: true, about: '', note: '', links: [], steps: ['Einatmen', 'Hinein', 'Halten', 'Zurück'], def: { rounds: 1, reps: 5, stepSec: 3, rest: 5, relax: 0 },
    parts: parts.map(p => ({ name: p.name, items: p.items.map(it => ({ id: id + '-' + (++n), name: it.name, how: it.how, link: it.link })) })) };
}

// ---------------------------------------------------------------- Zugriff
function cfgOf(sys) { return Object.assign({ rounds: 1 }, sys.def, db.cfg[sys.id] || {}); }
function itemOf(sys, id) { let b = null; sys.parts.forEach(p => p.items.forEach(it => { if (it.id === id) b = it; })); return b ? mergeItem(b, (db.edits[sys.id] || {})[id]) : null; }
function setEdit(sys, id, patch) { const e = db.edits[sys.id] || (db.edits[sys.id] = {}); e[id] = Object.assign({}, e[id], patch); save(); }
function todoCount(sys) { let n = 0; sys.parts.forEach(p => p.items.forEach(it => { if (itemOf(sys, it.id).todo) n++; })); return n; }

// ---------------------------------------------------------------- Ton
let actx = null;
function beep(freq, dur) {
  if (!db.sound) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime; o.frequency.value = freq; g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); } catch (e) {}
}

// ---------------------------------------------------------------- Ablauf einer Uebungseinheit
const R = { on: false, sys: null, plan: [], i: 0, t0: 0, pace: null, timer: 0, relax: null, lastStep: -1, done: {} };
const rBody = html => { $('r-body').innerHTML = html; };
function startRun(sys, partIdx) {
  const plan = sessionPlan(sys, partIdx, cfgOf(sys).rounds); if (!plan.length) return;
  Object.assign(R, { on: true, sys, plan, i: 0, t0: Date.now(), pace: null, relax: null, done: {} });
  $('run').hidden = false; if (location.hash !== '#run') location.hash = 'run';
  clearInterval(R.timer); R.timer = setInterval(runTick, 100); showItem();
}
function stopPace() { R.pace = null; R.lastStep = -1; $('r-pace').textContent = 'Takt starten'; }
function showItem() {
  stopPace(); R.relax = null;
  const sys = R.sys, p = R.plan[R.i], it = itemOf(sys, p.id), cfg = cfgOf(sys), link = safeUrl(it.link);
  const reps = repsOf(it, cfg);
  $('r-prog').textContent = (R.i + 1) + ' von ' + R.plan.length + ' · ' + sys.parts[p.part].name + (cfg.rounds > 1 ? ' · Runde ' + p.round + ' von ' + cfg.rounds : ''); $('r-bar').style.width = (R.i / R.plan.length * 100) + '%';
  $('r-ctl').hidden = false; $('r-prev').disabled = R.i === 0; $('r-next').textContent = R.i === R.plan.length - 1 ? 'Fertig' : 'Weiter';
  rBody('<div id="r-name">' + esc(it.name) + '</div>' +
    (sys.levels || sys.kg ? '<div class="row" style="flex-wrap:wrap;gap:14px;margin:4px 0 6px">' +
      (sys.levels ? '<div class="step"><button data-lv="-1">−</button><b>Stufe ' + it.level + '</b><button data-lv="1">+</button></div>' : '') +
      (sys.kg && !it.noKg ? '<div class="step"><button data-kg="-0.5">−</button><b>' + fmtKg(it.kg) + '</b><button data-kg="0.5">+</button></div>' : '') + '</div>' : '') +
    (it.noKg ? '<div class="muted small">Laut Programm ohne Gewicht, immer 6 Wiederholungen.</div>' : it.pct ? '<div class="muted small">Gewicht laut Programm: ' + it.pct + ' % des Grundgewichts (das ist das Gewicht je Hand in Übung 1 der Sequenz 1).</div>' : '') +

function runTick() {
  if (!R.on) return;
  if (R.relax) { const rem = (R.relax - Date.now()) / 1000; if (rem <= 0) { beep(660, 0.4); finishRun(); return; } if ($('rx-left')) $('rx-left').textContent = fmtClock(rem); return; }
  if (!R.pace) return;
  const sys = R.sys, cfg = cfgOf(sys), n = sys.steps.length, reps = repsOf(itemOf(sys, R.plan[R.i].id), cfg), st = paceAt((Date.now() - R.pace) / 1000, n, cfg.stepSec, reps);
  if (st.done) { stopPace(); R.done[R.i] = true; beep(880, 0.25); $('r-step').textContent = 'Geschafft'; $('r-rep').textContent = reps + ' Wiederholungen'; $('ball').style.transform = 'scale(.5)'; return; }
  const key = st.rep * 100 + st.step; if (key !== R.lastStep) { R.lastStep = key; beep(st.step === 0 ? 520 : 400, 0.06); $('r-step').textContent = sys.steps[st.step]; $('r-rep').textContent = 'Wiederholung ' + st.rep + ' von ' + reps; }
  $('ball').style.transform = 'scale(' + (0.5 + 0.5 * ballSize(st.step, st.into, n)).toFixed(3) + ')';
}
$('r-pace').onclick = () => { if (R.pace) stopPace(); else { R.pace = Date.now(); $('r-pace').textContent = 'Takt anhalten'; runTick(); } };
$('r-prev').onclick = () => { if (R.i > 0) { R.i--; showItem(); } };
$('r-next').onclick = () => {
  R.done[R.i] = true;

  const cfg = cfgOf(R.sys); stopPace(); $('r-bar').style.width = '100%';
  if (cfg.relax > 0) {
    R.relax = Date.now() + cfg.relax * 60000; $('r-ctl').hidden = true; $('r-prog').textContent = 'Entspannung';
    rBody('<div class="center" style="margin:auto 0"><div class="muted">Hinlegen, Augen zu, ruhig atmen.</div><div class="big" id="rx-left" style="font-size:56px">' + fmtClock(cfg.relax * 60) + '</div><button class="block" id="rx-skip">Überspringen</button></div>');

};
function finishRun() {
  if (!R.on) return;

  R.result = n ? { n, of: R.plan.length, min } : null; closeRun(); if (location.hash === '#run') history.back();
}

  const T0 = SYSTEMS[0], flat = [].concat.apply([], T0.parts.map(p => p.items));
  t('The Happy Body: 3 Sequenzen zu je 6, 5 Stufen, 6 Atemschritte, 18 verschiedene Namen, nirgends eine Anleitung', T0.parts.length === 3 && T0.parts.every(p => p.items.length === 6) && flat.every(i => !i.how && i.name && !i.todo) && new Set(flat.map(i => i.name)).size === 18 && T0.levels === 5 && T0.steps.length === 6 && T0.unsure);
  t('The Happy Body: belegte Plätze, feste Übungen ohne Gewicht, Gewichtsanteile', flat[0].name === 'Standing Tall' && flat[9].name === 'Rocking Trunk' && flat[16].name === 'Power Tower' && flat[8].name === 'Fly Up' && flat[10].name === 'Rising Tower' &&
    T0.parts.every(p => p.items[1].fix6 && p.items[2].fix6 && p.items[1].noKg && !p.items[0].fix6 && p.items[1].pct === 0) && flat[0].pct === 100 && flat[4].pct === 200 && flat[6].pct === 50 && flat[15].pct === 50 && safeUrl(flat[0].link) && safeUrl(flat[16].link));
  t('Wiederholungen: fest 6 oder eingestellt', repsOf({ fix6: true }, { reps: 3 }) === 6 && repsOf({}, { reps: 3 }) === 3);
